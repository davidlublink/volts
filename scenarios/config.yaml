global:
  domain:           'sip.target.system'
  domain_wss:       'sip.target.system:8089'

  pcmu_priority: 249
  pcma_priority: 250
  opus_priority: 248

  # Values to test udp+rtp (unencrypted)
  transport:        'udp'
  srtp:             ''
  dtls:             ''

  # Values to test tls+mandatory srtp
  # transport:        'tls'
  # srtp:             'sdes,force'
  # dtls:             'dtls,force'

  play_file:        '/voice_ref_files/8000_2m30.wav'
  play_file_2:      '/voice_ref_files/test01_20s.wav'
  asterisk_context: 'company_users'
  stun_address:     'public.stun.server:3478'

  # Number to dial to reach a service that will answer immediately and echo back RTP
  # Note that any destination that answers and sends RTP is sufficient
  echo_service:     '11111'

  # Time, in milliseconds, to wait for call to answer. 
  # Default time: 30
  pause_after_call: '30000'
databases:
  'sippproxydb':
    type:       'mysql'
    user:       'sipproxyremote'
    password:   'sipproxyremotepass'
    base:       'sipproxy'
    host:       'sipproxy.local'
  'astdb':
    type:       'mysql'
    user:       'asterisk'
    password:   'asteriskpass'
    base:       'asterisk'
    host:       'asterisk.local'
  'astdb_users':
    type:       'mysql'
    user:       'asterisk'
    password:   'asteriskpass'
    base:       'userids'
    host:       'asterisk.local'
accounts:
  # Alice - Used in many scenarios formerly 88881
  'alice':
    # Default auth username, user portion of to header
    username: '101'

    # Extension to dial to reach this device(if different than username )
    #  Default value is username field if this isn't set
    # extension: '##101'

    # Password used to authenticate
    password: 'SuperSecretPass'

    # Auth domain / realm
